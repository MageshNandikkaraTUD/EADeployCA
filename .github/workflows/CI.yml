name: Build and Push Docker Images
on:
 workflow_dispatch:        
# push:                                            
#   branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check Out Repository
      uses: actions/checkout@v3
    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Log in to Azure Container Registry
      run: |
        az acr login --name acreadeployca
    - name: Build and Push
      run: |
        docker build -f ./FrontEnd/Dockerfile -t acreadeployca.azurecr.io/frontend:latest .
        docker push acreadeployca.azurecr.io/frontend:latest
    - name: Run Trivy Scan on ACR Image
      uses: aquasecurity/trivy-action@0.28.0
      with: 
        image-ref: 'acreadeployca.azurecr.io/frontend:latest'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
