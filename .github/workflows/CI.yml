name: Build and Push Docker Images
on:
 workflow_dispatch:        
# push:                                            
#   branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check Out Repository
      uses: actions/checkout@v3
    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Build and Push Image 1
      run: |
        docker build -f ./FrontEnd/Dockerfile -t ACREADeployCA.azurecr.io/frontend:latest .
        docker push ACREADeployCA.azurecr.io/frontend:latest
    - name: Build and Push Image 2
      run: |
        docker build -f ./Backend/Dockerfile -t ACREADeployCA.azurecr.io/backend:latest .
        docker push ACREADeployCA.azurecr.io/backend:latest
