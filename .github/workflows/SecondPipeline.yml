name: Build and Push Docker Images
on:
 workflow_dispatch:        
# push:                                            
#   branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check Out Repository
      uses: actions/checkout@v3
    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Log in to Azure Container Registry
      run: |
        az acr login --name acreadeployca
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore and build
      run: |
        dotnet restore
        dotnet build --configuration Release --no-restore
    - name: Depcheck to scan backend dependencies
      uses: dependency-check/Dependency-Check_Action@main
      with: 
          project: 'Backend'
          path: '.'
          format: 'HTML'
    - name: Upload Depcheck results for Backend
      uses: actions/upload-artifact@v4
      with:
          name: Depcheck Backend report
          path: ${{github.workspace}}/reports
    - name: Depcheck to scan frontend dependencies
      uses: dependency-check/Dependency-Check_Action@main
      with: 
          project: 'FrontEnd'
          path: '.'
          format: 'HTML'
    - name: Upload Depcheck results for Frontend
      uses: actions/upload-artifact@v4
      with:
          name: Depcheck Frontend report
          path: ${{github.workspace}}/reports
    - name: SonarCloud Scan
      uses: sonarsource/sonarcloud-github-action@master
      with:
          projectBaseDir: .
          args: >
            -Dsonar.organization=mageshnandikkaratud
            -Dsonar.projectKey=MageshNandikkaraTUD_EADeployCA
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    - name: Build and Push frontend
      run: |
        docker build -f ./FrontEnd/Dockerfile -t acreadeployca.azurecr.io/frontend:${{ github.run_number }} .
        docker push acreadeployca.azurecr.io/frontend:${{ github.run_number }}
    - name: Run Trivy Scan on ACR Image
      uses: aquasecurity/trivy-action@0.28.0
      with: 
        image-ref: 'acreadeployca.azurecr.io/frontend:${{ github.run_number }}'
        format: 'table'
        ignore-unfixed: true
    - name: Build and Push backend
      run: |
        docker build -f ./Backend/Dockerfile -t acreadeployca.azurecr.io/backend:${{ github.run_number }} .
        docker push acreadeployca.azurecr.io/backend:${{ github.run_number }}
    - name: Run Trivy Scan on ACR Image
      uses: aquasecurity/trivy-action@0.28.0
      with: 
        image-ref: 'acreadeployca.azurecr.io/backend:${{ github.run_number }}'
        format: 'table'
        ignore-unfixed: true
        
